name: Engine security
on:
  pull_request:
  push:
    branches: [main, fix/engine-security-2026-09-09]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit reviewed universal pins and materialize candidate locks
        run: python3 scripts/dependency-audit.py --write-locks --report .ci-evidence/dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-advisories
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-wheel-locks
          path: engine/requirements-*.lock
          if-no-files-found: error
          retention-days: 14
  engine:
    needs: dependency-advisories
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reviewed-wheel-locks
          path: .ci-evidence/wheel-locks
      - name: Install exact core wheels using generated review hashes
        run: |
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r .ci-evidence/wheel-locks/requirements-core.lock
      - name: Engine and contract regressions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          git rev-parse HEAD > .ci-evidence/commit.txt
          python --version > .ci-evidence/python.txt
          python -m pip freeze > .ci-evidence/installed-dependencies.txt
          python -m unittest discover -s engine/tests -v 2>&1 | tee .ci-evidence/engine.txt
          node --test hooks/engine-contract-security.test.mjs hooks/review-hardening.test.mjs scripts/install.test.mjs 2>&1 | tee .ci-evidence/contracts.txt
      - name: Preserve exact tested source
        if: always() && runner.os == 'Linux' && matrix.python == '3.13'
        shell: bash
        run: git archive --format=tar HEAD > .ci-evidence/source.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engine-${{ runner.os }}-${{ matrix.python }}
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 14
  reachable-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch accessible histories and pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/audit-head/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
          mkdir -p "$RUNNER_TEMP/scanner" .ci-evidence
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/scanner/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/scanner/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scanner/archive.tar.gz" -C "$RUNNER_TEMP/scanner" gitleaks
          result=0
          python3 scripts/scan-history.py --gitleaks "$RUNNER_TEMP/scanner/gitleaks" --report .ci-evidence/history-eidolon.json || result=1
          for repo in eidolon-setup Hearth; do
            git clone --quiet "https://github.com/eidolonofficial/$repo.git" "$RUNNER_TEMP/audit-$repo"
            git -C "$RUNNER_TEMP/audit-$repo" fetch origin '+refs/heads/*:refs/remotes/audit-head/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
            python3 scripts/scan-history.py --gitleaks "$RUNNER_TEMP/scanner/gitleaks" --repo "$RUNNER_TEMP/audit-$repo" --report ".ci-evidence/history-$repo.json" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reachable-history
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 14
