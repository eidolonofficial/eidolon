name: Compatibility
on:
  push:
    branches: [main, release/codex-claude-compat]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Codex, installer, routing and freshness regression tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence
          node --version | tee evidence/node-version.txt
          git rev-parse HEAD > evidence/commit.txt
          node --test hooks/codex-hook.test.mjs scripts/install.test.mjs scripts/rehost.test.mjs scripts/skill-router.test.mjs 2>&1 | tee evidence/compatibility.txt
          node scripts/platform-refresh.mjs --check 2>&1 | tee evidence/platform-freshness.txt
      - name: Full existing and new suite
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          node --test hooks/*.test.mjs scripts/*.test.mjs 2>&1 | tee evidence/full-suite.txt
          node scripts/selfcheck.mjs 2>&1 | tee evidence/selfcheck.txt
          node scripts/eidolon-audit.mjs 2>&1 | tee evidence/audit.txt
          git archive --format=tar HEAD > evidence/source.tar
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compatibility-${{ runner.os }}
          path: evidence/
          retention-days: 7
          if-no-files-found: error
