name: Secrets scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reachable-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch accessible histories and pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/audit-head/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
          mkdir -p "$RUNNER_TEMP/scanner" .ci-evidence
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/scanner/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/scanner/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/scanner/archive.tar.gz" -C "$RUNNER_TEMP/scanner" gitleaks
          result=0
          python3 scripts/scan-history.py --gitleaks "$RUNNER_TEMP/scanner/gitleaks" --report .ci-evidence/history-eidolon.json || result=1
          for repo in eidolon-setup Hearth; do
            git clone --quiet "https://github.com/eidolonofficial/$repo.git" "$RUNNER_TEMP/audit-$repo"
            git -C "$RUNNER_TEMP/audit-$repo" fetch origin '+refs/heads/*:refs/remotes/audit-head/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/audit-pr/*'
            python3 scripts/scan-history.py --gitleaks "$RUNNER_TEMP/scanner/gitleaks" --repo "$RUNNER_TEMP/audit-$repo" --report ".ci-evidence/history-$repo.json" || result=1
          done
          exit "$result"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reachable-history
          path: .ci-evidence/
          include-hidden-files: true
          retention-days: 14
