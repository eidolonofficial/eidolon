name: Platform refresh
on:
  push:
    branches: [release/codex-claude-compat]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact audited freshness replacements
        run: node scripts/platform-refresh.mjs
      - name: Commit only when doctrine changed
        shell: bash
        run: |
          if git diff --quiet -- SKILL.md references/conductor-standard.md; then
            echo 'No platform refresh changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md references/conductor-standard.md
          git commit -m 'docs: replace stale Claude model and skill activation lore'
          git push origin HEAD:release/codex-claude-compat
