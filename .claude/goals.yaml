# eidolon goals - human-curated. done = outcome observed, not merely gate green.
north_star: >
  Eidolon turns any repo into a verified Claude Code working environment and carries real
  work through a human-gated, evidence-carrying pipeline - with nothing shipped that is
  incomplete, redundant, unnecessary, or detracting from that goal.

active_milestone: feature-triage-refactor

